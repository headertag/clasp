[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "clasp-sync"
version = "0.1.0"
description = "Waveform sync for double-system sound on macOS."
readme = "README.md"
requires-python = ">=3.11"
license = {file = "LICENSE"}
authors = [{name = "Clasp contributors"}]
keywords = ["audio", "video", "synchronization", "macos", "ffmpeg"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: MacOS X",
    "Intended Audience :: End Users/Desktop",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.13",
    "Topic :: Multimedia :: Sound/Audio",
    "Topic :: Multimedia :: Video",
]
dependencies = ["numpy>=1.26,<3", "scipy>=1.12,<2"]

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
clasp = "clasp.cli:main"
clasp-gui = "clasp.gui:main"

[project.urls]
Repository = "https://github.com/headertag/clasp"
Issues = "https://github.com/headertag/clasp/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
